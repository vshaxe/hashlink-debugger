name: CI

on:
  push:
    # This should disable running the workflow on tags
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  # https://github.blog/changelog/2020-07-06-github-actions-manual-triggers-with-workflow_dispatch/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: krdlab/setup-haxe@v2
      with:
        haxe-version: 4.3.7
    - name: Print haxe version
      run: haxe -version
    - name: Install haxelib dependencies
      run: |
        haxelib git format https://github.com/HaxeFoundation/format.git
        haxelib git hscript https://github.com/HaxeFoundation/hscript.git
        haxelib install vshaxe
        haxelib install vscode
        haxelib install vscode-debugadapter
    - name: Build extension
      run: make build
    - name: Build CLI hl
      run: |
        cd debugger
        haxe debugger.hxml
        cd ..
    - uses: actions/setup-node@v7
      with:
        node-version: '22.x'
    - name: Print npm and node version
      run: |
        npm --version
        node --version
    - name: Install global vsce package
      run: |
        npm install vsce -g
        npm list vsce -g
    - name: Package nightly build
      run: |
        export PKG_VER=$(npm pkg get version | xargs)
        export SHORT_HASH=$(git rev-parse --short HEAD)
        npm pkg set 'version'=${PKG_VER}-dev-${SHORT_HASH}
        npm install --ignore-scripts
        make package
        cp haxe-hl-${PKG_VER}-dev-${SHORT_HASH}.vsix haxe-hl-dev.vsix
    - name: Check packaged adapter starts
      run: |
        rm -rf vsix && unzip -q haxe-hl-dev.vsix -d vsix
        body='{"seq":1,"type":"request","command":"initialize","arguments":{"adapterID":"hl","linesStartAt1":true,"columnsStartAt1":true,"pathFormat":"path"}}'
        out=$( (printf 'Content-Length: %d\r\n\r\n%s' ${#body} "$body"; sleep 3) | timeout 10 node vsix/extension/adapter.js || true )
        echo "$out"
        echo "$out" | grep -q '"command":"initialize","success":true'
    - name: Upload extension artifact
      uses: actions/upload-artifact@v7
      with:
        name: vscode_extension
        path: haxe-hl-dev.vsix

  build_and_test_nightly:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: krdlab/setup-haxe@v2
      with:
        haxe-version: latest
    - name: Print haxe version
      run: haxe -version
    - name: Install haxelib dependencies
      run: |
        haxelib git format https://github.com/HaxeFoundation/format.git
        haxelib git hscript https://github.com/HaxeFoundation/hscript.git
        haxelib install vshaxe
        haxelib install vscode
        haxelib install vscode-debugadapter
    - name: Build extension
      run: make build
    - name: Build CLI hl
      run: |
        cd debugger
        haxe debugger.hxml
        cd ..
    - name: Install hl
      run: |
        git clone https://github.com/HaxeFoundation/hashlink.git hashlink
        sudo apt-get update
        sudo apt-get install -qqy libpng-dev libturbojpeg-dev libvorbis-dev libopenal-dev libmbedtls-dev libuv1-dev libsqlite3-dev
        cd hashlink
        make hl libhl.so fmt.hdll ssl.hdll ui.hdll uv.hdll
        sudo make install
        hl --version
        cd ..
    - name: Run tests
      run: |
        cd tests
        haxe RunCi.hxml
        cd ..
