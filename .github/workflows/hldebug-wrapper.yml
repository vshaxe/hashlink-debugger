name: hldebug-wrapper

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "hldebug-wrapper/src/**"
      - "hldebug-wrapper/binding.gyp"
      - ".github/workflows/hldebug-wrapper.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dir: win
          - os: ubuntu-latest
            dir: linux
          - os: macos-15-intel
            dir: mac
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Fetch mdbg from HashLink
      if: runner.os == 'macOS'
      run: |
        git clone --depth 1 https://github.com/HaxeFoundation/hashlink.git hashlink
        cp -r hashlink/include/mdbg hldebug-wrapper/src/mdbg
    - name: Build hldebug.node
      shell: bash
      run: |
        npm install --ignore-scripts
        cd hldebug-wrapper
        rm -f lib/${{ matrix.dir }}/hldebug.node
        npm install --ignore-scripts
        ../node_modules/.bin/node-gyp rebuild
    - uses: actions/upload-artifact@v4
      with:
        name: hldebug-${{ matrix.dir }}
        path: hldebug-wrapper/lib/${{ matrix.dir }}/hldebug.node
        if-no-files-found: error
